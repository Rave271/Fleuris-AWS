filebeat.inputs:
  - type: filestream
    id: fleuris_app_logs
    enabled: true
    paths:
      - /var/log/fleuris/app.json.log
    parsers:
      - ndjson:
          target: ""
          add_error_key: true

  - type: filestream
    id: nginx_access_logs
    enabled: true
    paths:
      - /var/log/nginx/fleuris_access.log

output.elasticsearch:
  hosts: ["http://localhost:9200"]

setup.kibana:
  host: "http://localhost:5601"
